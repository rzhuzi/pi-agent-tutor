name: Assemble course snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/assemble-course-source.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble course snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/pi-course-source.part-* > references/pi-course-source.md
          test "$(wc -c < references/pi-course-source.md)" -eq 76544

      - name: Commit assembled snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/pi-course-source.md
          git rm -r .upload
          git commit -m "Add Pi course source snapshot"
          git push
